<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-label="四大经典量化算法族谱">
  <defs>
    <linearGradient id="fm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1424"/><stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <marker id="fm-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#5f7194"/>
    </marker>
  </defs>
  <rect width="960" height="380" fill="url(#fm-bg)" rx="14"/>
  <text x="480" y="40" text-anchor="middle" font-size="15.5" font-weight="700" fill="#e8ecf6" font-family="sans-serif">四篇论文一张图：两条产品线，四种经典配方</text>

  <!-- 行标 -->
  <text x="92" y="106" text-anchor="middle" font-size="12.5" font-weight="700" fill="#818cf8" font-family="monospace">W8A8</text>
  <text x="92" y="124" text-anchor="middle" font-size="11" fill="#99a5bf" font-family="sans-serif">算得准</text>
  <text x="92" y="236" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e879f9" font-family="monospace">W4A16</text>
  <text x="92" y="254" text-anchor="middle" font-size="11" fill="#99a5bf" font-family="sans-serif">存得小</text>

  <!-- 上排：W8A8 -->
  <rect x="140" y="66" width="370" height="88" rx="10" fill="#818cf812" stroke="#818cf8" stroke-width="1.3"/>
  <text x="325" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#818cf8" font-family="monospace">LLM.int8() · 2022-08</text>
  <text x="325" y="118" text-anchor="middle" font-size="12" fill="#b6c0d6" font-family="sans-serif">切 0.5% 离群维度走 FP16 —— 混合精度</text>
  <text x="325" y="140" text-anchor="middle" font-size="11.5" fill="#99a5bf" font-family="sans-serif">找到病根，但矩阵乘拆两路</text>

  <rect x="540" y="66" width="370" height="88" rx="10" fill="#34d3990f" stroke="#34d399" stroke-width="1.4"/>
  <text x="725" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#34d399" font-family="monospace">SmoothQuant · ICML 2023</text>
  <text x="725" y="118" text-anchor="middle" font-size="12" fill="#b6c0d6" font-family="sans-serif">等价缩放搬难度 —— 全整数两路合一</text>
  <text x="725" y="140" text-anchor="middle" font-size="11.5" fill="#99a5bf" font-family="sans-serif">175B 近无损 · 融进上一层零开销</text>

  <line x1="516" y1="110" x2="534" y2="110" stroke="#5f7194" stroke-width="1.6" marker-end="url(#fm-arrow)"/>

  <!-- 下排：W4A16 -->
  <rect x="140" y="196" width="370" height="88" rx="10" fill="#22d3ee10" stroke="#22d3ee" stroke-width="1.3"/>
  <text x="325" y="224" text-anchor="middle" font-size="13.5" font-weight="700" fill="#22d3ee" font-family="monospace">GPTQ · ICLR 2023</text>
  <text x="325" y="248" text-anchor="middle" font-size="12" fill="#b6c0d6" font-family="sans-serif">Hessian 定重要性 + 逐列记账补偿</text>
  <text x="325" y="270" text-anchor="middle" font-size="11.5" fill="#99a5bf" font-family="sans-serif">一次量化、处处运行，4bit 近无损</text>

  <rect x="540" y="196" width="370" height="88" rx="10" fill="#e879f910" stroke="#e879f9" stroke-width="1.5"/>
  <text x="725" y="224" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e879f9" font-family="monospace">AWQ · MLSys 2024 最佳论文</text>
  <text x="725" y="248" text-anchor="middle" font-size="12" fill="#b6c0d6" font-family="sans-serif">激活感知缩放护 1% 命门通道</text>
  <text x="725" y="270" text-anchor="middle" font-size="11.5" fill="#99a5bf" font-family="sans-serif">纯 4-bit 统一格式 · 开源圈最常见配方之一</text>

  <line x1="516" y1="240" x2="534" y2="240" stroke="#5f7194" stroke-width="1.6" marker-end="url(#fm-arrow)"/>

  <!-- 正交组合注记 -->
  <path d="M325 158 C 325 178, 420 178, 500 192" fill="none" stroke="#5f7194" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#fm-arrow)"/>
  <path d="M725 158 C 725 178, 640 178, 560 192" fill="none" stroke="#5f7194" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#fm-arrow)"/>
  <text x="480" y="186" text-anchor="middle" font-size="11.5" fill="#99a5bf" font-family="sans-serif">缩放 × 记账彼此正交，主流工具链常组合使用</text>

  <!-- 下一站 -->
  <rect x="140" y="308" width="770" height="52" rx="10" fill="#fbbf2410" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="525" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#fbbf24" font-family="sans-serif">下一站 · 第 5 讲：GGUF 与 k-quants —— Q4_K_M 们是什么</text>
  <text x="525" y="350" text-anchor="middle" font-size="11.5" fill="#99a5bf" font-family="sans-serif">llama.cpp 把 4-bit「方言」又往前推了一步</text>
  <line x1="725" y1="288" x2="725" y2="302" stroke="#fbbf24" stroke-width="1.4" marker-end="url(#fm-arrow)"/>
</svg>
