<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="SoC 内的 NPU 与统一内存">
  <defs>
    <linearGradient id="soc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1424"/><stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <marker id="soc-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e879f9aa"/>
    </marker>
  </defs>
  <rect width="960" height="360" fill="url(#soc-bg)" rx="14"/>
  <text x="40" y="44" font-size="14" font-weight="700" fill="#e8ecf6" font-family="sans-serif">谁来算：SoC 里的三兄弟与一块共享内存</text>

  <!-- 中央：统一内存 -->
  <rect x="330" y="130" width="300" height="120" rx="14" fill="#e879f914" stroke="#e879f9" stroke-width="1.8"/>
  <text x="480" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#e879f9" font-family="sans-serif">统一内存</text>
  <text x="480" y="198" text-anchor="middle" font-size="12.5" fill="#b6c0d6" font-family="sans-serif">CPU / GPU / NPU 共享同一块</text>
  <text x="480" y="220" text-anchor="middle" font-size="12.5" fill="#fbbf24" font-family="sans-serif">量化后的权重只放一份，谁算谁读</text>

  <!-- 左上：CPU -->
  <g>
    <rect x="60" y="70" width="200" height="88" rx="12" fill="#b6c0d612" stroke="#b6c0d688" stroke-width="1.3"/>
    <text x="160" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#e8ecf6" font-family="monospace">CPU</text>
    <text x="160" y="120" text-anchor="middle" font-size="12.5" fill="#b6c0d6" font-family="sans-serif">通用 · 什么都能算</text>
    <text x="160" y="140" text-anchor="middle" font-size="12" fill="#99a5bf" font-family="sans-serif">但矩阵乘法慢——兜底与调度</text>
  </g>
  <path d="M262 130 L326 168" stroke="#e879f9aa" stroke-width="1.8" fill="none" marker-end="url(#soc-ar)"/>

  <!-- 左下：GPU -->
  <g>
    <rect x="60" y="222" width="200" height="88" rx="12" fill="#818cf812" stroke="#818cf8" stroke-width="1.3"/>
    <text x="160" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#818cf8" font-family="monospace">GPU</text>
    <text x="160" y="272" text-anchor="middle" font-size="12.5" fill="#b6c0d6" font-family="sans-serif">并行快 · 但费电</text>
    <text x="160" y="292" text-anchor="middle" font-size="12" fill="#99a5bf" font-family="sans-serif">适合突发负载，持续推理发热明显</text>
  </g>
  <path d="M262 266 L326 220" stroke="#e879f9aa" stroke-width="1.8" fill="none" marker-end="url(#soc-ar)"/>

  <!-- 右：NPU（主角放大） -->
  <g>
    <rect x="700" y="86" width="230" height="188" rx="14" fill="#22d3ee16" stroke="#22d3ee" stroke-width="2"/>
    <text x="815" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#22d3ee" font-family="monospace">NPU</text>
    <text x="815" y="140" text-anchor="middle" font-size="12.5" fill="#b6c0d6" font-family="sans-serif">为矩阵乘法定制的电路</text>
    <g font-family="sans-serif">
      <rect x="720" y="156" width="190" height="32" rx="6" fill="#22d3ee10" stroke="#22d3ee66" stroke-width="1"/>
      <text x="815" y="177" text-anchor="middle" font-size="12.5" fill="#22d3ee" font-family="sans-serif">单位功耗算力高一个量级</text>
      <rect x="720" y="196" width="190" height="32" rx="6" fill="#22d3ee10" stroke="#22d3ee66" stroke-width="1"/>
      <text x="815" y="217" text-anchor="middle" font-size="12.5" fill="#22d3ee" font-family="sans-serif">旗舰已破 100 TOPS</text>
      <rect x="720" y="236" width="190" height="32" rx="6" fill="#fbbf2410" stroke="#fbbf2466" stroke-width="1"/>
      <text x="815" y="257" text-anchor="middle" font-size="12" fill="#fbbf24" font-family="sans-serif">但要先经编译器「翻译」（QNN/CoreML/MLC）</text>
    </g>
  </g>
  <path d="M698 190 L634 190" stroke="#e879f9aa" stroke-width="1.8" fill="none" marker-end="url(#soc-ar)"/>

  <text x="40" y="336" font-size="12" fill="#99a5bf" font-family="sans-serif">统一内存是苹果 Apple silicon 与新一代手机平台的共同卖点：零拷贝——权重不用在三个计算单元之间来回搬运，「模型转换后掉性能」多半卡在编译翻译这一步。</text>
</svg>
