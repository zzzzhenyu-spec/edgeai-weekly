<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="LLM.int8() 与 GPTQ 双主角总览">
  <defs>
    <linearGradient id="om-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1424"/><stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <marker id="om-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#5f7194"/>
    </marker>
  </defs>
  <rect width="960" height="360" fill="url(#om-bg)" rx="14"/>
  <text x="480" y="42" text-anchor="middle" font-size="15.5" font-weight="700" fill="#e8ecf6" font-family="sans-serif">量化双子星：一个救激活，一个压权重</text>

  <!-- 中枢：异常值 -->
  <circle cx="480" cy="150" r="34" fill="#fbbf2418" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="480" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fbbf24" font-family="sans-serif">异常值</text>
  <text x="480" y="163" text-anchor="middle" font-size="12.5" fill="#fbbf24" font-family="sans-serif">OUTLIER</text>

  <!-- 左：LLM.int8() -->
  <rect x="60" y="92" width="270" height="120" rx="10" fill="#818cf812" stroke="#818cf8" stroke-width="1.4"/>
  <text x="195" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#818cf8" font-family="monospace">LLM.int8() · 2022-08</text>
  <text x="195" y="146" text-anchor="middle" font-size="12.5" fill="#b6c0d6" font-family="sans-serif">激活离群 → 混合精度分解</text>
  <text x="195" y="168" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="sans-serif">0.5% 维度 FP16 + 99.5% INT8</text>
  <text x="195" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ecf6" font-family="monospace">→ W8A8「算得准」</text>

  <!-- 右：GPTQ -->
  <rect x="630" y="92" width="270" height="120" rx="10" fill="#22d3ee12" stroke="#22d3ee" stroke-width="1.4"/>
  <text x="765" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#22d3ee" font-family="monospace">GPTQ · 2022-10</text>
  <text x="765" y="146" text-anchor="middle" font-size="12.5" fill="#b6c0d6" font-family="sans-serif">权重逐列量化 + 误差补偿</text>
  <text x="765" y="168" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="sans-serif">Hessian 定重要性 · 4bit 近无损</text>
  <text x="765" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ecf6" font-family="monospace">→ W4A16「存得小」</text>

  <line x1="335" y1="150" x2="440" y2="150" stroke="#5f7194" stroke-width="1.5" marker-end="url(#om-arrow)"/>
  <line x1="625" y1="150" x2="520" y2="150" stroke="#5f7194" stroke-width="1.5" marker-end="url(#om-arrow)"/>

  <!-- 底部：正交叠加 -->
  <rect x="170" y="252" width="620" height="74" rx="10" fill="#e879f90f" stroke="#e879f9" stroke-width="1.3"/>
  <text x="480" y="280" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e879f9" font-family="sans-serif">两招正交，可以叠着用：4-bit 权重 × 8-bit 激活</text>
  <text x="480" y="304" text-anchor="middle" font-size="12.5" fill="#b6c0d6" font-family="sans-serif">今天端侧 4-bit 生态（GPTQ 格式 / Q4_K_M 们）的直系算法源头</text>
  <line x1="195" y1="218" x2="300" y2="248" stroke="#5f7194" stroke-width="1.5" marker-end="url(#om-arrow)"/>
  <line x1="765" y1="218" x2="660" y2="248" stroke="#5f7194" stroke-width="1.5" marker-end="url(#om-arrow)"/>
</svg>
