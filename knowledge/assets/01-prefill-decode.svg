<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="prefill 并行读入与 decode 逐 token 生成的动态对比">
  <defs>
    <linearGradient id="pd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1424"/><stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <linearGradient id="pd-w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.62"/><stop offset="1" stop-color="#1a5f74" stop-opacity="0.28"/>
    </linearGradient>
  </defs>
  <rect width="960" height="440" fill="url(#pd-bg)" rx="14"/>

  <!-- ===== 上半：PREFILL 并行 ===== -->
  <text x="48" y="42" font-size="15" font-weight="700" fill="#818cf8" font-family="monospace">PREFILL 预填充</text>
  <text x="200" y="42" font-size="12.5" fill="#b6c0d6" font-family="sans-serif">整段提示一次性并行读入 · 算力瓶颈（决定首字时延）</text>

  <g fill="#818cf8">
    <rect x="48" y="86" width="38" height="38" rx="7" fill="#818cf822" stroke="#818cf8" stroke-width="1.3">
      <animate attributeName="opacity" values="0.18;1;1;0.18;0.18" keyTimes="0;0.08;0.72;0.84;1" dur="5s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="98" y="86" width="38" height="38" rx="7" fill="#818cf822" stroke="#818cf8" stroke-width="1.3">
      <animate attributeName="opacity" values="0.18;1;1;0.18;0.18" keyTimes="0;0.08;0.72;0.84;1" dur="5s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="148" y="86" width="38" height="38" rx="7" fill="#818cf822" stroke="#818cf8" stroke-width="1.3">
      <animate attributeName="opacity" values="0.18;1;1;0.18;0.18" keyTimes="0;0.08;0.72;0.84;1" dur="5s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="198" y="86" width="38" height="38" rx="7" fill="#818cf822" stroke="#818cf8" stroke-width="1.3">
      <animate attributeName="opacity" values="0.18;1;1;0.18;0.18" keyTimes="0;0.08;0.72;0.84;1" dur="5s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="248" y="86" width="38" height="38" rx="7" fill="#818cf822" stroke="#818cf8" stroke-width="1.3">
      <animate attributeName="opacity" values="0.18;1;1;0.18;0.18" keyTimes="0;0.08;0.72;0.84;1" dur="5s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="298" y="86" width="38" height="38" rx="7" fill="#818cf822" stroke="#818cf8" stroke-width="1.3">
      <animate attributeName="opacity" values="0.18;1;1;0.18;0.18" keyTimes="0;0.08;0.72;0.84;1" dur="5s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="348" y="86" width="38" height="38" rx="7" fill="#818cf822" stroke="#818cf8" stroke-width="1.3">
      <animate attributeName="opacity" values="0.18;1;1;0.18;0.18" keyTimes="0;0.08;0.72;0.84;1" dur="5s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="398" y="86" width="38" height="38" rx="7" fill="#818cf822" stroke="#818cf8" stroke-width="1.3">
      <animate attributeName="opacity" values="0.18;1;1;0.18;0.18" keyTimes="0;0.08;0.72;0.84;1" dur="5s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="242" y="148" text-anchor="middle" font-size="12" fill="#99a5bf" font-family="sans-serif">提示词 token —— 一起亮（并行）</text>

  <path d="M452 105 h44" stroke="#818cf8aa" stroke-width="2.5" fill="none">
    <animate attributeName="opacity" values="0.2;1;1;0.2;0.2" keyTimes="0;0.1;0.72;0.84;1" dur="5s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="0" dur="1s"/>
  </path>
  <path d="M488 98 l10 7 l-10 7" fill="none" stroke="#818cf8aa" stroke-width="2.5"/>

  <rect x="510" y="74" width="180" height="62" rx="10" fill="#fbbf240d" stroke="#fbbf2488" stroke-width="1.3" stroke-dasharray="6 4">
    <animate attributeName="opacity" values="0.25;1;1;0.25;0.25" keyTimes="0;0.12;0.72;0.84;1" dur="5s" begin="0.35s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#fbbf24" font-family="monospace">KV 缓存一次成型</text>
  <text x="600" y="120" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="sans-serif">整段历史的中间结果同时就位</text>

  <!-- ===== 下半：DECODE 串行 ===== -->
  <line x1="40" y1="196" x2="920" y2="196" stroke="#ffffff14" stroke-width="1"/>
  <text x="48" y="238" font-size="15" font-weight="700" fill="#22d3ee" font-family="monospace">DECODE 解码</text>
  <text x="180" y="238" font-size="12.5" fill="#b6c0d6" font-family="sans-serif">逐 token 生成 · 每步把全部权重读一遍 · 带宽瓶颈（决定生成速度）</text>

  <rect x="48" y="284" width="330" height="48" rx="9" fill="url(#pd-w)" stroke="#22d3ee" stroke-width="1.4">
    <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="0.55s" begin="0.3s" repeatCount="indefinite"/>
  </rect>
  <text x="213" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family="monospace">全部权重 ≈ 3.5GB</text>
  <text x="213" y="322" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="sans-serif">每生成一个 token 都要完整读一遍</text>
  <text x="213" y="356" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="sans-serif">读得越小（更低比特量化）→ 生成越快、越省电</text>

  <path d="M392 308 h44" stroke="#22d3eeaa" stroke-width="2.5" fill="none"/>
  <path d="M428 301 l10 7 l-10 7" fill="none" stroke="#22d3eeaa" stroke-width="2.5"/>

  <g fill="#22d3ee">
    <rect x="450" y="284" width="38" height="38" rx="7" fill="#22d3ee18" stroke="#22d3ee" stroke-width="1.3">
      <animate attributeName="opacity" values="0.18;1;1;0.18;0.18" keyTimes="0;0.1;0.9;0.98;1" dur="5s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="500" y="284" width="38" height="38" rx="7" fill="#22d3ee18" stroke="#22d3ee" stroke-width="1.3">
      <animate attributeName="opacity" values="0.18;1;1;0.18;0.18" keyTimes="0;0.1;0.9;0.98;1" dur="5s" begin="0.85s" repeatCount="indefinite"/>
    </rect>
    <rect x="550" y="284" width="38" height="38" rx="7" fill="#22d3ee18" stroke="#22d3ee" stroke-width="1.3">
      <animate attributeName="opacity" values="0.18;1;1;0.18;0.18" keyTimes="0;0.1;0.9;0.98;1" dur="5s" begin="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="600" y="284" width="38" height="38" rx="7" fill="#22d3ee18" stroke="#22d3ee" stroke-width="1.3">
      <animate attributeName="opacity" values="0.18;1;1;0.18;0.18" keyTimes="0;0.1;0.9;0.98;1" dur="5s" begin="1.95s" repeatCount="indefinite"/>
    </rect>
    <rect x="650" y="284" width="38" height="38" rx="7" fill="#22d3ee18" stroke="#22d3ee" stroke-width="1.3">
      <animate attributeName="opacity" values="0.18;1;1;0.18;0.18" keyTimes="0;0.1;0.9;0.98;1" dur="5s" begin="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="700" y="284" width="38" height="38" rx="7" fill="#22d3ee18" stroke="#22d3ee" stroke-width="1.3">
      <animate attributeName="opacity" values="0.18;1;1;0.18;0.18" keyTimes="0;0.1;0.9;0.98;1" dur="5s" begin="3.05s" repeatCount="indefinite"/>
    </rect>
    <rect x="750" y="284" width="38" height="38" rx="7" fill="#22d3ee18" stroke="#22d3ee" stroke-width="1.3">
      <animate attributeName="opacity" values="0.18;1;1;0.18;0.18" keyTimes="0;0.1;0.9;0.98;1" dur="5s" begin="3.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="800" y="284" width="38" height="38" rx="7" fill="#22d3ee18" stroke="#22d3ee" stroke-width="1.3">
      <animate attributeName="opacity" values="0.18;1;1;0.18;0.18" keyTimes="0;0.1;0.9;0.98;1" dur="5s" begin="4.15s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="644" y="346" text-anchor="middle" font-size="12" fill="#99a5bf" font-family="sans-serif">生成的 token —— 一个接一个点亮（串行）</text>

  <text x="48" y="416" font-size="12.5" fill="#99a5bf" font-family="sans-serif">动画示意：上方 8 个提示 token 同步点亮（并行）；下方输出 token 依次点亮（串行），且每步伴随整条权重被读取一次。</text>
</svg>
