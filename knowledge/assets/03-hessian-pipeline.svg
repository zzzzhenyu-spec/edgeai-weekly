<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="Hessian 定重要性与 GPTQ 工程化流水线">
  <defs>
    <linearGradient id="hp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1424"/><stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <marker id="hp-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#5f7194"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="url(#hp-bg)" rx="14"/>
  <text x="480" y="40" text-anchor="middle" font-size="15.5" font-weight="700" fill="#e8ecf6" font-family="sans-serif">Hessian：这一列有多重要，误差就敢让它多担</text>

  <!-- 上排：校准数据 → H 对角 -->
  <g>
    <rect x="70" y="76" width="180" height="70" rx="10" fill="#818cf812" stroke="#818cf8" stroke-width="1.4"/>
    <text x="160" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#818cf8" font-family="monospace">校准数据 X（约 128 条）</text>
    <text x="160" y="126" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="sans-serif">随便一小撮真实输入即可</text>
  </g>
  <g>
    <rect x="330" y="66" width="220" height="90" rx="10" fill="#fbbf240f" stroke="#fbbf24" stroke-width="1.4"/>
    <text x="440" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fbbf24" font-family="monospace">H = 2·XᵀX（逐层现算）</text>
    <text x="440" y="118" text-anchor="middle" font-size="12.5" fill="#b6c0d6" font-family="sans-serif">对角元大 → 这列权重大幅牵动输出</text>
    <text x="440" y="140" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="sans-serif">「重要列少动它，边角列多担误差」</text>
  </g>
  <line x1="254" y1="111" x2="324" y2="111" stroke="#5f7194" stroke-width="1.5" marker-end="url(#hp-arrow)"/>

  <!-- 右上：act-order -->
  <g>
    <rect x="640" y="66" width="250" height="90" rx="10" fill="#e879f90f" stroke="#e879f9" stroke-width="1.3"/>
    <text x="765" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#e879f9" font-family="monospace">act-order：先难后易</text>
    <text x="765" y="118" text-anchor="middle" font-size="12.5" fill="#b6c0d6" font-family="sans-serif">按 H 对角降序处理列</text>
    <text x="765" y="140" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="sans-serif">2-bit 从「完全崩」救到「能用」</text>
  </g>
  <line x1="554" y1="111" x2="634" y2="111" stroke="#5f7194" stroke-width="1.5" marker-end="url(#hp-arrow)"/>

  <!-- 下排：GPTQ 工程流水线 -->
  <text x="480" y="196" text-anchor="middle" font-size="13.5" font-weight="700" fill="#22d3ee" font-family="sans-serif">工程三招：把逐列算法 scale 到千亿参数</text>
  <g font-family="sans-serif">
    <rect x="70" y="216" width="250" height="104" rx="10" fill="#22d3ee0f" stroke="#22d3ee" stroke-width="1.3"/>
    <text x="195" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#22d3ee">① 分块处理</text>
    <text x="195" y="268" text-anchor="middle" font-size="12.5" fill="#b6c0d6">128 列一块，块内一次性</text>
    <text x="195" y="290" text-anchor="middle" font-size="12.5" fill="#b6c0d6">算好 Hessian 逆的更新量</text>
    <text x="195" y="312" text-anchor="middle" font-size="12.5" fill="#99a5bf">（Cholesky 分解，惰性批更新）</text>

    <rect x="360" y="216" width="250" height="104" rx="10" fill="#22d3ee0f" stroke="#22d3ee" stroke-width="1.3"/>
    <text x="485" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#22d3ee">② 顺序解耦</text>
    <text x="485" y="268" text-anchor="middle" font-size="12.5" fill="#b6c0d6">数值上等价于逐列 OBQ，</text>
    <text x="485" y="290" text-anchor="middle" font-size="12.5" fill="#b6c0d6">但对处理顺序几乎不敏感，</text>
    <text x="485" y="312" text-anchor="middle" font-size="12.5" fill="#99a5bf">GPU 上跑得又稳又快</text>

    <rect x="650" y="216" width="250" height="104" rx="10" fill="#22d3ee0f" stroke="#22d3ee" stroke-width="1.3"/>
    <text x="775" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#22d3ee">③ 任意比特宽</text>
    <text x="775" y="268" text-anchor="middle" font-size="12.5" fill="#b6c0d6">2/3/4/8-bit 一套通吃，</text>
    <text x="775" y="290" text-anchor="middle" font-size="12.5" fill="#b6c0d6">权重压好即静态落盘，</text>
    <text x="775" y="312" text-anchor="middle" font-size="12.5" fill="#99a5bf">推理时零额外计算</text>
  </g>
  <line x1="324" y1="268" x2="354" y2="268" stroke="#5f7194" stroke-width="1.5" marker-end="url(#hp-arrow)"/>
  <line x1="614" y1="268" x2="644" y2="268" stroke="#5f7194" stroke-width="1.5" marker-end="url(#hp-arrow)"/>

  <text x="480" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ecf6" font-family="sans-serif">成绩单：1750 亿参数压到 3-4 bit 约需 4 个 GPU 时；4-bit 平均掉点通常在 1% 以内</text>
  <text x="480" y="380" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="sans-serif">一次量化、处处运行——这正是端侧社区拿它当默认 4-bit 工具的原因</text>
</svg>
