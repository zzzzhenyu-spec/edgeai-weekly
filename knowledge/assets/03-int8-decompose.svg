<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="LLM.int8 混合精度分解：离群列 FP16 + 其余 INT8">
  <defs>
    <linearGradient id="id-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1424"/><stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <marker id="id-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#5f7194"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="url(#id-bg)" rx="14"/>
  <text x="480" y="40" text-anchor="middle" font-size="15.5" font-weight="700" fill="#e8ecf6" font-family="sans-serif">LLM.int8()：把 0.5% 的刺头拎出来，用 FP16 养着</text>
  <text x="480" y="64" text-anchor="middle" font-size="13" fill="#b6c0d6" font-family="monospace">C = X·W = X_i·W_i (FP16) + S_f(X)·S_f(W) (INT8)</text>

  <!-- 输入 X -->
  <g>
    <rect x="70" y="120" width="120" height="150" rx="8" fill="#818cf812" stroke="#818cf8" stroke-width="1.4"/>
    <text x="130" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#818cf8" font-family="monospace">激活 X</text>
    <!-- 内部小格子示意，第 5 列金色 -->
    <g stroke="#818cf866" stroke-width="0.8" fill="#818cf81f">
      <rect x="86" y="160" width="18" height="14"/><rect x="106" y="160" width="18" height="14"/><rect x="126" y="160" width="18" height="14"/><rect x="146" y="160" width="18" height="14"/><rect x="86" y="176" width="18" height="14"/><rect x="106" y="176" width="18" height="14"/><rect x="126" y="176" width="18" height="14"/><rect x="146" y="176" width="18" height="14"/><rect x="86" y="192" width="18" height="14"/><rect x="106" y="192" width="18" height="14"/><rect x="126" y="192" width="18" height="14"/><rect x="146" y="192" width="18" height="14"/><rect x="86" y="208" width="18" height="14"/><rect x="106" y="208" width="18" height="14"/><rect x="126" y="208" width="18" height="14"/><rect x="146" y="208" width="18" height="14"/>
    </g>
    <rect x="166" y="160" width="18" height="62" fill="#fbbf2455" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="130" y="296" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="sans-serif">金色列 = 离群维度</text>
  </g>

  <!-- 上路：FP16 -->
  <g>
    <rect x="300" y="92" width="240" height="88" rx="10" fill="#fbbf240f" stroke="#fbbf24" stroke-width="1.4"/>
    <text x="420" y="118" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fbbf24" font-family="sans-serif">离群子矩阵（约 0.5% 维度）</text>
    <text x="420" y="142" text-anchor="middle" font-size="12.5" fill="#b6c0d6" font-family="sans-serif">X_i · W_i 直接用 FP16 算</text>
    <text x="420" y="164" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="sans-serif">量少，算得起；保住大值精度</text>
  </g>

  <!-- 下路：INT8 -->
  <g>
    <rect x="300" y="212" width="240" height="88" rx="10" fill="#22d3ee0f" stroke="#22d3ee" stroke-width="1.4"/>
    <text x="420" y="238" text-anchor="middle" font-size="13.5" font-weight="700" fill="#22d3ee" font-family="sans-serif">其余 99.5% 维度</text>
    <text x="420" y="262" text-anchor="middle" font-size="12.5" fill="#b6c0d6" font-family="sans-serif">逐维缩放后压成 INT8 向量</text>
    <text x="420" y="284" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="sans-serif">无离群干扰，刻度恢复正常 → 8-bit 矩阵乘</text>
  </g>

  <line x1="194" y1="160" x2="294" y2="136" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#id-arrow)"/>
  <line x1="194" y1="230" x2="294" y2="256" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#id-arrow)"/>

  <!-- 汇合相加 -->
  <g>
    <rect x="640" y="152" width="80" height="88" rx="10" fill="#e879f90f" stroke="#e879f9" stroke-width="1.6"/>
    <text x="680" y="190" text-anchor="middle" font-size="20" font-weight="700" fill="#e879f9" font-family="monospace">+</text>
    <text x="680" y="216" text-anchor="middle" font-size="12.5" fill="#b6c0d6" font-family="sans-serif">两路相加</text>
  </g>
  <line x1="544" y1="136" x2="634" y2="170" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#id-arrow)"/>
  <line x1="544" y1="256" x2="634" y2="222" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#id-arrow)"/>

  <!-- 输出 C -->
  <rect x="800" y="164" width="110" height="64" rx="8" fill="#818cf812" stroke="#818cf8" stroke-width="1.4"/>
  <text x="855" y="190" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e8ecf6" font-family="monospace">输出 C</text>
  <text x="855" y="210" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="sans-serif">FP16 精度</text>
  <line x1="724" y1="196" x2="794" y2="196" stroke="#5f7194" stroke-width="1.5" marker-end="url(#id-arrow)"/>

  <!-- SMIL：金色数据块 FP16 路流动 -->
  <rect x="0" y="0" width="12" height="12" rx="3" fill="#fbbf24" opacity="0.9">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M186 176 L 300 122 L 540 122 L 640 176 L 800 196"/>
  </rect>
  <!-- SMIL：青色数据块 INT8 路流动 -->
  <rect x="0" y="0" width="12" height="12" rx="3" fill="#22d3ee" opacity="0.9">
    <animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite" path="M186 226 L 300 268 L 540 268 L 640 222 L 800 196"/>
  </rect>

  <text x="480" y="340" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="sans-serif">维度集合离线统计一次即可（跨输入稳定）；矩阵乘内部自动完成，模型代码不用改</text>
  <text x="480" y="364" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="sans-serif">（动图：金/青方块沿两条路径流动汇合，本站绘制）</text>
</svg>
