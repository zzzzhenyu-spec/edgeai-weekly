<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="SmoothQuant 缩放公式与 α 搬迁强度">
  <defs>
    <linearGradient id="sa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1424"/><stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <marker id="sa-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#818cf8"/>
    </marker>
  </defs>
  <rect width="960" height="360" fill="url(#sa-bg)" rx="14"/>
  <text x="480" y="40" text-anchor="middle" font-size="15.5" font-weight="700" fill="#e8ecf6" font-family="sans-serif">SmoothQuant：每个通道一把尺，α 决定搬多少</text>

  <!-- 公式 -->
  <rect x="205" y="62" width="550" height="54" rx="10" fill="#818cf812" stroke="#818cf8" stroke-width="1.3"/>
  <text x="480" y="88" text-anchor="middle" font-size="15" fill="#e8ecf6" font-family="monospace">s_j = max|X_j|^α ⁄ max|W_j|^(1−α)</text>
  <text x="480" y="108" text-anchor="middle" font-size="11.5" fill="#99a5bf" font-family="sans-serif">激活幅度与权重幅度各占一头，指数 α 分蛋糕</text>

  <!-- α 滑杆 -->
  <line x1="120" y1="200" x2="840" y2="200" stroke="#5f7194" stroke-width="3" stroke-linecap="round"/>
  <g fill="#818cf8">
    <circle cx="120" cy="200" r="7"/><circle cx="480" cy="200" r="7" fill="#34d399"/><circle cx="840" cy="200" r="7"/>
  </g>
  <text x="480" y="176" text-anchor="middle" font-size="12.5" fill="#34d399" font-family="sans-serif">▼ 多数模型的甜点 ≈ 0.5</text>
  <text x="120" y="230" text-anchor="middle" font-size="12.5" fill="#b6c0d6" font-family="monospace">α = 0</text>
  <text x="480" y="230" text-anchor="middle" font-size="12.5" fill="#b6c0d6" font-family="monospace">α = 0.5</text>
  <text x="840" y="230" text-anchor="middle" font-size="12.5" fill="#b6c0d6" font-family="monospace">α = 1</text>

  <!-- 左状态：不搬 -->
  <rect x="60" y="252" width="260" height="84" rx="10" fill="#fbbf2410" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="190" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#fbbf24" font-family="sans-serif">不搬：激活还是硬骨头</text>
  <text x="190" y="300" text-anchor="middle" font-size="12" fill="#b6c0d6" font-family="sans-serif">离群撑爆激活刻度</text>
  <text x="190" y="320" text-anchor="middle" font-size="12" fill="#99a5bf" font-family="sans-serif">W8A8 精度崩</text>

  <!-- 中状态：平衡 -->
  <rect x="350" y="252" width="260" height="84" rx="10" fill="#34d39910" stroke="#34d399" stroke-width="1.4"/>
  <text x="480" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#34d399" font-family="sans-serif">平衡：两边都落在格子里</text>
  <text x="480" y="300" text-anchor="middle" font-size="12" fill="#b6c0d6" font-family="sans-serif">激活压平 + 权重撑而不爆</text>
  <text x="480" y="320" text-anchor="middle" font-size="12" fill="#99a5bf" font-family="sans-serif">W8A8 近乎无损</text>

  <!-- 右状态：全搬 -->
  <rect x="640" y="252" width="260" height="84" rx="10" fill="#e879f910" stroke="#e879f9" stroke-width="1.2"/>
  <text x="770" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#e879f9" font-family="sans-serif">全搬：权重自己撑爆</text>
  <text x="770" y="300" text-anchor="middle" font-size="12" fill="#b6c0d6" font-family="sans-serif">被放大的列超出量化范围</text>
  <text x="770" y="320" text-anchor="middle" font-size="12" fill="#99a5bf" font-family="sans-serif">误差转移阵地</text>

  <line x1="480" y1="214" x2="480" y2="246" stroke="#34d399" stroke-width="1.4" marker-end="url(#sa-arrow)"/>
  <line x1="180" y1="214" x2="180" y2="246" stroke="#818cf8" stroke-width="1.2" marker-end="url(#sa-arrow)"/>
  <line x1="780" y1="214" x2="780" y2="246" stroke="#818cf8" stroke-width="1.2" marker-end="url(#sa-arrow)"/>
  <text x="480" y="140" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="sans-serif">α 按模型微调：离群越凶猛，平衡点越往右挪；s 只在校准集上统计一次</text>
</svg>
