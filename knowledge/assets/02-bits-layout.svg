<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-label="FP16 与 INT4 的位布局对比">
  <defs>
    <linearGradient id="bl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1424"/><stop offset="1" stop-color="#101a30"/>
    </linearGradient>
  </defs>
  <rect width="960" height="350" fill="url(#bl-bg)" rx="14"/>
  <text x="480" y="44" text-anchor="middle" font-size="15.5" font-weight="700" fill="#e8ecf6" font-family="sans-serif">同一个数，两种存法：浮点的「浮动」与定点的「格子」</text>

  <!-- FP16 位布局：1+5+10 -->
  <text x="70" y="92" font-size="14" font-weight="700" fill="#818cf8" font-family="monospace">FP16 · 16 bit</text>
  <g>
    <rect x="70" y="104" width="34" height="46" rx="4" fill="#e879f926" stroke="#e879f9" stroke-width="1.3"/>
    <text x="87" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#e879f9" font-family="monospace">s</text>
    <g fill="#22d3ee1f" stroke="#22d3ee" stroke-width="1.3">
      <rect x="108" y="104" width="34" height="46" rx="4"/><rect x="144" y="104" width="34" height="46" rx="4"/>
      <rect x="180" y="104" width="34" height="46" rx="4"/><rect x="216" y="104" width="34" height="46" rx="4"/>
      <rect x="252" y="104" width="34" height="46" rx="4"/>
    </g>
    <g fill="#22d3ee" font-family="monospace" font-size="12.5" text-anchor="middle">
      <text x="125" y="133">e</text><text x="161" y="133">e</text><text x="197" y="133">e</text>
      <text x="233" y="133">e</text><text x="269" y="133">e</text>
    </g>
    <g fill="#fbbf2418" stroke="#fbbf24" stroke-width="1.3">
      <rect x="290" y="104" width="34" height="46" rx="4"/><rect x="326" y="104" width="34" height="46" rx="4"/>
      <rect x="362" y="104" width="34" height="46" rx="4"/><rect x="398" y="104" width="34" height="46" rx="4"/>
      <rect x="434" y="104" width="34" height="46" rx="4"/><rect x="470" y="104" width="34" height="46" rx="4"/>
      <rect x="506" y="104" width="34" height="46" rx="4"/><rect x="542" y="104" width="34" height="46" rx="4"/>
      <rect x="578" y="104" width="34" height="46" rx="4"/><rect x="614" y="104" width="34" height="46" rx="4"/>
      <rect x="650" y="104" width="34" height="46" rx="4"/><rect x="686" y="104" width="34" height="46" rx="4"/>
      <rect x="722" y="104" width="34" height="46" rx="4"/><rect x="758" y="104" width="34" height="46" rx="4"/>
      <rect x="794" y="104" width="34" height="46" rx="4"/><rect x="830" y="104" width="34" height="46" rx="4"/>
    </g>
    <g fill="#fbbf24" font-family="monospace" font-size="12.5" text-anchor="middle">
      <text x="447" y="133">m · 10 bit 尾数</text>
    </g>
    <text x="125" y="170" text-anchor="middle" font-size="12.5" fill="#e879f9" font-family="sans-serif">符号 1</text>
    <text x="199" y="170" text-anchor="middle" font-size="12.5" fill="#22d3ee" font-family="sans-serif">指数 5</text>
    <text x="600" y="170" text-anchor="middle" font-size="12.5" fill="#fbbf24" font-family="sans-serif">尾数 10</text>
    <text x="460" y="201" text-anchor="middle" font-size="13" fill="#b6c0d6" font-family="monospace">数值 = (−1)^s × 1.m × 2^(e−15)　→　65,536 种取值，间隔随大小「浮动」</text>
  </g>

  <!-- INT4 -->
  <text x="70" y="240" font-size="14" font-weight="700" fill="#22d3ee" font-family="monospace">INT4 · 4 bit</text>
  <g fill="#22d3ee26" stroke="#22d3ee" stroke-width="1.3">
    <rect x="70" y="252" width="34" height="46" rx="4"/><rect x="106" y="252" width="34" height="46" rx="4"/>
    <rect x="142" y="252" width="34" height="46" rx="4"/><rect x="178" y="252" width="34" height="46" rx="4"/>
  </g>
  <g fill="#22d3ee" font-family="monospace" font-size="12.5" text-anchor="middle">
    <text x="87" y="281">b3</text><text x="123" y="281">b2</text><text x="159" y="281">b1</text><text x="195" y="281">b0</text>
  </g>
  <!-- 16 格刻度条 -->
  <g>
    <rect x="300" y="252" width="540" height="46" rx="6" fill="#ffffff08" stroke="#ffffff2a" stroke-width="1"/>
    <g stroke="#ffffff30" stroke-width="1">
      <line x1="333.75" y1="252" x2="333.75" y2="298"/><line x1="367.5" y1="252" x2="367.5" y2="298"/>
      <line x1="401.25" y1="252" x2="401.25" y2="298"/><line x1="435" y1="252" x2="435" y2="298"/>
      <line x1="468.75" y1="252" x2="468.75" y2="298"/><line x1="502.5" y1="252" x2="502.5" y2="298"/>
      <line x1="536.25" y1="252" x2="536.25" y2="298"/><line x1="570" y1="252" x2="570" y2="298"/>
      <line x1="603.75" y1="252" x2="603.75" y2="298"/><line x1="637.5" y1="252" x2="637.5" y2="298"/>
      <line x1="671.25" y1="252" x2="671.25" y2="298"/><line x1="705" y1="252" x2="705" y2="298"/>
      <line x1="738.75" y1="252" x2="738.75" y2="298"/><line x1="772.5" y1="252" x2="772.5" y2="298"/>
      <line x1="806.25" y1="252" x2="806.25" y2="298"/>
    </g>
    <text x="570" y="281" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="sans-serif">16 个等距格子，别无选择</text>
  </g>
  <text x="460" y="330" text-anchor="middle" font-size="13" fill="#b6c0d6" font-family="monospace">量化 = 把 FP16 里连续分布的权重，搬进这 16 个等距格子</text>
</svg>
