<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-label="GPTQ 逐列量化误差补偿示意">
  <defs>
    <linearGradient id="gc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1424"/><stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <marker id="gc-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#e879f9"/>
    </marker>
  </defs>
  <rect width="960" height="380" fill="url(#gc-bg)" rx="14"/>
  <text x="480" y="42" text-anchor="middle" font-size="15.5" font-weight="700" fill="#e8ecf6" font-family="sans-serif">GPTQ 的直觉：量化一列，把误差记账给后面的列</text>

  <!-- 权重矩阵：10 列 × 8 行，格 30×26，起点 x=110 y=96 -->
  <!-- 已量化列 0-3（暗青）、当前列 4（亮青框）、未量化 5-9（灰） -->
  <g>
    <!-- 已量化区 -->
    <g fill="#22d3ee22" stroke="#22d3ee88" stroke-width="0.8">
      <rect x="110" y="96" width="30" height="26"/><rect x="110" y="122" width="30" height="26"/><rect x="110" y="148" width="30" height="26"/><rect x="110" y="174" width="30" height="26"/><rect x="110" y="200" width="30" height="26"/><rect x="110" y="226" width="30" height="26"/><rect x="110" y="252" width="30" height="26"/><rect x="110" y="278" width="30" height="26"/>
      <rect x="140" y="96" width="30" height="26"/><rect x="140" y="122" width="30" height="26"/><rect x="140" y="148" width="30" height="26"/><rect x="140" y="174" width="30" height="26"/><rect x="140" y="200" width="30" height="26"/><rect x="140" y="226" width="30" height="26"/><rect x="140" y="252" width="30" height="26"/><rect x="140" y="278" width="30" height="26"/>
      <rect x="170" y="96" width="30" height="26"/><rect x="170" y="122" width="30" height="26"/><rect x="170" y="148" width="30" height="26"/><rect x="170" y="174" width="30" height="26"/><rect x="170" y="200" width="30" height="26"/><rect x="170" y="226" width="30" height="26"/><rect x="170" y="252" width="30" height="26"/><rect x="170" y="278" width="30" height="26"/>
      <rect x="200" y="96" width="30" height="26"/><rect x="200" y="122" width="30" height="26"/><rect x="200" y="148" width="30" height="26"/><rect x="200" y="174" width="30" height="26"/><rect x="200" y="200" width="30" height="26"/><rect x="200" y="226" width="30" height="26"/><rect x="200" y="252" width="30" height="26"/><rect x="200" y="278" width="30" height="26"/>
    </g>
    <!-- 当前列 -->
    <g fill="#22d3ee55" stroke="#22d3ee" stroke-width="1.6">
      <rect x="230" y="96" width="30" height="26"/><rect x="230" y="122" width="30" height="26"/><rect x="230" y="148" width="30" height="26"/><rect x="230" y="174" width="30" height="26"/><rect x="230" y="200" width="30" height="26"/><rect x="230" y="226" width="30" height="26"/><rect x="230" y="252" width="30" height="26"/><rect x="230" y="278" width="30" height="26"/>
    </g>
    <!-- 未量化区 -->
    <g fill="#ffffff08" stroke="#ffffff2a" stroke-width="0.8">
      <rect x="260" y="96" width="30" height="26"/><rect x="260" y="122" width="30" height="26"/><rect x="260" y="148" width="30" height="26"/><rect x="260" y="174" width="30" height="26"/><rect x="260" y="200" width="30" height="26"/><rect x="260" y="226" width="30" height="26"/><rect x="260" y="252" width="30" height="26"/><rect x="260" y="278" width="30" height="26"/>
      <rect x="290" y="96" width="30" height="26"/><rect x="290" y="122" width="30" height="26"/><rect x="290" y="148" width="30" height="26"/><rect x="290" y="174" width="30" height="26"/><rect x="290" y="200" width="30" height="26"/><rect x="290" y="226" width="30" height="26"/><rect x="290" y="252" width="30" height="26"/><rect x="290" y="278" width="30" height="26"/>
      <rect x="320" y="96" width="30" height="26"/><rect x="320" y="122" width="30" height="26"/><rect x="320" y="148" width="30" height="26"/><rect x="320" y="174" width="30" height="26"/><rect x="320" y="200" width="30" height="26"/><rect x="320" y="226" width="30" height="26"/><rect x="320" y="252" width="30" height="26"/><rect x="320" y="278" width="30" height="26"/>
      <rect x="350" y="96" width="30" height="26"/><rect x="350" y="122" width="30" height="26"/><rect x="350" y="148" width="30" height="26"/><rect x="350" y="174" width="30" height="26"/><rect x="350" y="200" width="30" height="26"/><rect x="350" y="226" width="30" height="26"/><rect x="350" y="252" width="30" height="26"/><rect x="350" y="278" width="30" height="26"/>
      <rect x="380" y="96" width="30" height="26"/><rect x="380" y="122" width="30" height="26"/><rect x="380" y="148" width="30" height="26"/><rect x="380" y="174" width="30" height="26"/><rect x="380" y="200" width="30" height="26"/><rect x="380" y="226" width="30" height="26"/><rect x="380" y="252" width="30" height="26"/><rect x="380" y="278" width="30" height="26"/>
      <rect x="410" y="96" width="30" height="26"/><rect x="410" y="122" width="30" height="26"/><rect x="410" y="148" width="30" height="26"/><rect x="410" y="174" width="30" height="26"/><rect x="410" y="200" width="30" height="26"/><rect x="410" y="226" width="30" height="26"/><rect x="410" y="252" width="30" height="26"/><rect x="410" y="278" width="30" height="26"/>
    </g>
  </g>

  <!-- 图例 -->
  <g font-size="12.5" font-family="sans-serif">
    <rect x="110" y="330" width="16" height="12" fill="#22d3ee22" stroke="#22d3ee88" stroke-width="0.8"/>
    <text x="132" y="340" fill="#99a5bf">已量化</text>
    <rect x="196" y="330" width="16" height="12" fill="#22d3ee55" stroke="#22d3ee" stroke-width="1.4"/>
    <text x="218" y="340" fill="#b6c0d6">当前列</text>
    <rect x="284" y="330" width="16" height="12" fill="#ffffff08" stroke="#ffffff2a" stroke-width="0.8"/>
    <text x="306" y="340" fill="#99a5bf">等待处理</text>
  </g>

  <!-- 误差箭头：当前列 → 未量化列 -->
  <g stroke="#e879f9" stroke-width="1.6" fill="none">
    <path d="M262 150 Q 300 120 332 108" marker-end="url(#gc-arrow)"/>
    <path d="M262 190 Q 310 180 362 176" marker-end="url(#gc-arrow)"/>
    <path d="M262 240 Q 310 260 362 264" marker-end="url(#gc-arrow)"/>
  </g>
  <text x="290" y="292" font-size="12.5" fill="#e879f9" font-family="sans-serif" text-anchor="middle">量化误差 e</text>
  <text x="290" y="310" font-size="12.5" fill="#e879f9" font-family="sans-serif" text-anchor="middle">摊给未量化的列</text>

  <!-- 右侧解说 -->
  <g font-family="sans-serif">
    <text x="560" y="110" font-size="13.5" font-weight="700" fill="#e8ecf6">一列一列来，先到先得、后者买单</text>
    <text x="560" y="140" font-size="12.5" fill="#b6c0d6">① 把当前列的权重压到 4-bit 格子上</text>
    <text x="560" y="164" font-size="12.5" fill="#b6c0d6">② 落格必有舍入误差 e（第 2 讲的老朋友）</text>
    <text x="560" y="188" font-size="12.5" fill="#b6c0d6">③ 不认命：把 e 折算成对未量化列的修正量</text>
    <text x="560" y="212" font-size="12.5" fill="#b6c0d6">④ 后面的列「预支」这份修正再量化</text>
    <text x="560" y="248" font-size="12.5" fill="#99a5bf">效果：误差不再是各自为政的舍入噪声，</text>
    <text x="560" y="272" font-size="12.5" fill="#99a5bf">而是被整条流水线持续对冲的系统量</text>
    <text x="560" y="308" font-size="12.5" fill="#e879f9">摊多少？由下一张图的 Hessian 说了算</text>
  </g>
  <!-- SMIL：处理指针沿列从左到右扫描 -->
  <g>
    <path d="M110 88 l7 10 l-14 0 Z" fill="#22d3ee">
      <animateMotion dur="5s" repeatCount="indefinite" path="M0 0 L 300 0"/>
    </path>
  </g>
  <text x="480" y="82" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="sans-serif">（动图：指针逐列右移，已量化区随之生长，本站绘制）</text>
</svg>
