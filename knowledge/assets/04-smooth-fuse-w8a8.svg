<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-label="SmoothQuant 融合进上一层与 W8A8 效果">
  <defs>
    <linearGradient id="sf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1424"/><stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <marker id="sf-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#5f7194"/>
    </marker>
  </defs>
  <rect width="960" height="380" fill="url(#sf-bg)" rx="14"/>
  <text x="480" y="40" text-anchor="middle" font-size="15.5" font-weight="700" fill="#e8ecf6" font-family="sans-serif">零开销落地：缩放融进上一层，W8A8 全整数</text>

  <!-- 流水线 -->
  <rect x="60" y="86" width="200" height="96" rx="10" fill="#818cf812" stroke="#818cf8" stroke-width="1.3"/>
  <text x="160" y="114" text-anchor="middle" font-size="13.5" font-weight="700" fill="#818cf8" font-family="sans-serif">前一层 Linear</text>
  <text x="160" y="140" text-anchor="middle" font-size="12" fill="#b6c0d6" font-family="sans-serif">÷s 乘进它的权重里</text>
  <text x="160" y="162" text-anchor="middle" font-size="12" fill="#34d399" font-family="sans-serif">s 被吸收 ✓ 零新增算子</text>

  <line x1="268" y1="134" x2="318" y2="134" stroke="#5f7194" stroke-width="1.6" marker-end="url(#sf-arrow)"/>

  <rect x="324" y="86" width="180" height="96" rx="10" fill="#fbbf2410" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="414" y="112" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fbbf24" font-family="sans-serif">激活 ÷ s</text>
  <text x="414" y="138" text-anchor="middle" font-size="12" fill="#b6c0d6" font-family="sans-serif">离群被压平</text>
  <text x="414" y="160" text-anchor="middle" font-size="12" fill="#99a5bf" font-family="sans-serif">分布变「正常」</text>

  <line x1="512" y1="134" x2="562" y2="134" stroke="#5f7194" stroke-width="1.6" marker-end="url(#sf-arrow)"/>

  <rect x="568" y="86" width="180" height="96" rx="10" fill="#22d3ee10" stroke="#22d3ee" stroke-width="1.3"/>
  <text x="658" y="112" text-anchor="middle" font-size="13.5" font-weight="700" fill="#22d3ee" font-family="sans-serif">当前层 W × s</text>
  <text x="658" y="138" text-anchor="middle" font-size="12" fill="#b6c0d6" font-family="sans-serif">权重扛下放大</text>
  <text x="658" y="160" text-anchor="middle" font-size="12" fill="#99a5bf" font-family="sans-serif">仍在可控范围</text>

  <line x1="756" y1="134" x2="806" y2="134" stroke="#5f7194" stroke-width="1.6" marker-end="url(#sf-arrow)"/>

  <rect x="812" y="86" width="110" height="96" rx="10" fill="#34d39912" stroke="#34d399" stroke-width="1.5"/>
  <text x="867" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#34d399" font-family="monospace">INT8</text>
  <text x="867" y="146" text-anchor="middle" font-size="12" fill="#b6c0d6" font-family="monospace">GEMM</text>
  <text x="867" y="166" text-anchor="middle" font-size="11.5" fill="#99a5bf" font-family="sans-serif">纯整数</text>

  <!-- 效果条 -->
  <rect x="90" y="212" width="780" height="56" rx="10" fill="#ffffff06" stroke="#ffffff22" stroke-width="1"/>
  <text x="480" y="238" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e8ecf6" font-family="sans-serif">W8A8：权重激活全 8-bit，混合精度的「两路拆分」不再需要</text>
  <text x="480" y="258" text-anchor="middle" font-size="12" fill="#99a5bf" font-family="sans-serif">对 FP16 精度对齐 · INT8 Tensor Core 满血运行</text>

  <!-- 四格战绩 -->
  <g font-family="sans-serif">
    <rect x="90" y="290" width="180" height="66" rx="10" fill="#34d3990f" stroke="#34d39988" stroke-width="1"/>
    <text x="180" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#34d399" font-family="monospace">OPT-175B</text>
    <text x="180" y="340" text-anchor="middle" font-size="11.5" fill="#b6c0d6">近乎无损跑 INT8</text>
    <rect x="290" y="290" width="180" height="66" rx="10" fill="#22d3ee0f" stroke="#22d3ee88" stroke-width="1"/>
    <text x="380" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#22d3ee" font-family="monospace">≈1.56×</text>
    <text x="380" y="340" text-anchor="middle" font-size="11.5" fill="#b6c0d6">对比 FP16 提速</text>
    <rect x="490" y="290" width="180" height="66" rx="10" fill="#818cf80f" stroke="#818cf888" stroke-width="1"/>
    <text x="580" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#818cf8" font-family="monospace">内存 −50%</text>
    <text x="580" y="340" text-anchor="middle" font-size="11.5" fill="#b6c0d6">权重激活同宽</text>
    <rect x="690" y="290" width="180" height="66" rx="10" fill="#e879f90f" stroke="#e879f988" stroke-width="1"/>
    <text x="780" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#e879f9" font-family="monospace">530B</text>
    <text x="780" y="340" text-anchor="middle" font-size="11.5" fill="#b6c0d6">单节点即可服务</text>
  </g>
</svg>
