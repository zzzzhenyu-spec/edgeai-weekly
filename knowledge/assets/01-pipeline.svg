<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-label="端侧推理流水线全景">
  <defs>
    <linearGradient id="pg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1424"/><stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <marker id="pg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f7194"/>
    </marker>
    <marker id="pg-arrow-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="960" height="340" fill="url(#pg-bg)" rx="14"/>

  <!-- 块 1：模型权重 -->
  <g>
    <rect x="24" y="72" width="140" height="118" rx="12" fill="#818cf815" stroke="#818cf8" stroke-width="1.5"/>
    <path d="M62 96 h30 l12 12 v34 h-42 z" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M92 96 v12 h12" fill="none" stroke="#818cf8" stroke-width="1.5"/>
    <line x1="70" y1="122" x2="96" y2="122" stroke="#818cf899" stroke-width="1.5"/>
    <line x1="70" y1="130" x2="90" y2="130" stroke="#818cf899" stroke-width="1.5"/>
    <text x="94" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#e8ecf6" font-family="sans-serif">模型权重</text>
    <text x="94" y="182" text-anchor="middle" font-size="12" fill="#b6c0d6" font-family="monospace">7B × FP16 ≈ 14GB</text>
  </g>
  <line x1="168" y1="131" x2="194" y2="131" stroke="#5f7194" stroke-width="2" marker-end="url(#pg-arrow)"/>

  <!-- 块 2：量化 -->
  <g>
    <rect x="196" y="72" width="140" height="118" rx="12" fill="#22d3ee15" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="266" cy="116" r="17" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
    <path d="M266 104 a12 12 0 0 1 12 12 l-12 0 z" fill="#22d3ee" opacity="0.8"/>
    <path d="M266 128 a12 12 0 0 1 -12 -12 l12 0 z" fill="#22d3ee" opacity="0.4"/>
    <text x="266" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#e8ecf6" font-family="sans-serif">量化 Q4</text>
    <text x="266" y="182" text-anchor="middle" font-size="12" fill="#fbbf24" font-family="monospace">≈ 3.5GB（约 1/4）</text>
  </g>
  <line x1="340" y1="131" x2="366" y2="131" stroke="#5f7194" stroke-width="2" marker-end="url(#pg-arrow)"/>

  <!-- 块 3：统一内存 -->
  <g>
    <rect x="368" y="46" width="178" height="200" rx="12" fill="#e879f912" stroke="#e879f9" stroke-width="1.5"/>
    <text x="457" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#e8ecf6" font-family="sans-serif">统一内存</text>
    <rect x="386" y="86" width="46" height="30" rx="6" fill="#22d3ee22" stroke="#22d3ee99" stroke-width="1"/>
    <text x="409" y="106" text-anchor="middle" font-size="12.5" fill="#22d3ee" font-family="monospace">NPU</text>
    <rect x="438" y="86" width="46" height="30" rx="6" fill="#818cf822" stroke="#818cf899" stroke-width="1"/>
    <text x="461" y="106" text-anchor="middle" font-size="12.5" fill="#818cf8" font-family="monospace">GPU</text>
    <rect x="490" y="86" width="38" height="30" rx="6" fill="#b6c0d622" stroke="#b6c0d688" stroke-width="1"/>
    <text x="509" y="106" text-anchor="middle" font-size="12.5" fill="#b6c0d6" font-family="monospace">CPU</text>
    <rect x="386" y="130" width="142" height="46" rx="8" fill="none" stroke="#fbbf2499" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="457" y="150" text-anchor="middle" font-size="12" fill="#fbbf24" font-family="monospace">权重（只放一份）</text>
    <text x="457" y="167" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="sans-serif">三算力单元零拷贝共享</text>
    <rect x="386" y="186" width="142" height="44" rx="8" fill="#fbbf240d" stroke="#fbbf2477" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="457" y="206" text-anchor="middle" font-size="12" fill="#fbbf24" font-family="monospace">+ KV 缓存（随对话膨胀）</text>
    <text x="457" y="222" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="sans-serif">与权重抢同一块内存</text>
  </g>
  <line x1="550" y1="131" x2="576" y2="131" stroke="#5f7194" stroke-width="2" marker-end="url(#pg-arrow)"/>

  <!-- 块 4：两阶段推理 -->
  <g>
    <rect x="578" y="58" width="182" height="88" rx="12" fill="#818cf812" stroke="#818cf8" stroke-width="1.5"/>
    <text x="669" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#818cf8" font-family="monospace">PREFILL 预填充</text>
    <text x="669" y="108" text-anchor="middle" font-size="12" fill="#b6c0d6" font-family="sans-serif">整段提示一次并行读入</text>
    <text x="669" y="128" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="sans-serif">吃算力 · 决定首字时延</text>
    <rect x="578" y="160" width="182" height="88" rx="12" fill="#22d3ee12" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="669" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#22d3ee" font-family="monospace">DECODE 解码</text>
    <text x="669" y="210" text-anchor="middle" font-size="12" fill="#b6c0d6" font-family="sans-serif">逐 token 生成 · 每步读全部权重</text>
    <text x="669" y="230" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="sans-serif">吃带宽 · 决定生成速度</text>
  </g>
  <line x1="764" y1="131" x2="790" y2="131" stroke="#22d3ee" stroke-width="2" marker-end="url(#pg-arrow-c)"/>

  <!-- 块 5：输出 -->
  <g>
    <rect x="792" y="92" width="144" height="78" rx="12" fill="#fbbf2410" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="864" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e8ecf6" font-family="sans-serif">token 流</text>
    <g font-family="monospace" font-size="12" fill="#fbbf24">
      <rect x="818" y="132" width="20" height="18" rx="4" fill="#fbbf2422" stroke="#fbbf2488"/>
      <rect x="842" y="132" width="20" height="18" rx="4" fill="#fbbf2422" stroke="#fbbf2488"/>
      <rect x="866" y="132" width="20" height="18" rx="4" fill="#fbbf2422" stroke="#fbbf2488"/>
      <rect x="890" y="132" width="20" height="18" rx="4" fill="#fbbf2410" stroke="#fbbf2455" stroke-dasharray="3 3"/>
    </g>
  </g>

  <!-- 底部工具链条 -->
  <line x1="40" y1="282" x2="920" y2="282" stroke="#ffffff14" stroke-width="1"/>
  <text x="40" y="310" font-size="12.5" fill="#99a5bf" font-family="sans-serif">贯穿全程的工具链：</text>
  <g font-family="monospace" font-size="12.5" fill="#b6c0d6">
    <text x="152" y="310">llama.cpp（GGUF 全流程）</text>
    <text x="330" y="310">· Ollama（易用层）</text>
    <text x="462" y="310">· MLX（苹果统一内存）</text>
    <text x="622" y="310">· ExecuTorch / MNN（App 内嵌）</text>
  </g>
</svg>
