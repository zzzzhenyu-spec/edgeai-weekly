<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-label="模型权重就是一堆数字">
  <defs>
    <linearGradient id="wm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1424"/><stop offset="1" stop-color="#101a30"/>
    </linearGradient>
  </defs>
  <rect width="960" height="300" fill="url(#wm-bg)" rx="14"/>

  <!-- 左：权重矩阵 -->
  <g>
    <text x="40" y="44" font-size="14" font-weight="700" fill="#e8ecf6" font-family="sans-serif">模型 = 几万个权重矩阵</text>
    <g transform="translate(40,62)">
      <rect x="0" y="0" width="180" height="180" rx="8" fill="#818cf810" stroke="#818cf8" stroke-width="1.4"/>
      <!-- 6x6 格子，明暗示意权重值 -->
      <g stroke="#818cf855" stroke-width="0.8">
        <rect x="14"  y="14"  width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.75"/>
        <rect x="40"  y="14"  width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.30"/>
        <rect x="66"  y="14"  width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.55"/>
        <rect x="92"  y="14"  width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.18"/>
        <rect x="118" y="14"  width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.62"/>
        <rect x="144" y="14"  width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.25"/>
        <rect x="14"  y="40"  width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.40"/>
        <rect x="40"  y="40"  width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.70"/>
        <rect x="66"  y="40"  width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.22"/>
        <rect x="92"  y="40"  width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.50"/>
        <rect x="118" y="40"  width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.33"/>
        <rect x="144" y="40"  width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.60"/>
        <rect x="14"  y="66"  width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.28"/>
        <rect x="40"  y="66"  width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.45"/>
        <rect x="66"  y="66"  width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.72"/>
        <rect x="92"  y="66"  width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.35"/>
        <rect x="118" y="66"  width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.52"/>
        <rect x="144" y="66"  width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.20"/>
        <rect x="14"  y="92"  width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.58"/>
        <rect x="40"  y="92"  width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.24"/>
        <rect x="66"  y="92"  width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.42"/>
        <rect x="92"  y="92"  width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.68"/>
        <rect x="118" y="92"  width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.30"/>
        <rect x="144" y="92"  width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.55"/>
        <rect x="14"  y="118" width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.35"/>
        <rect x="40"  y="118" width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.62"/>
        <rect x="66"  y="118" width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.28"/>
        <rect x="92"  y="118" width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.48"/>
        <rect x="118" y="118" width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.71"/>
        <rect x="144" y="118" width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.33"/>
        <rect x="14"  y="144" width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.50"/>
        <rect x="40"  y="144" width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.20"/>
        <rect x="66"  y="144" width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.58"/>
        <rect x="92"  y="144" width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.38"/>
        <rect x="118" y="144" width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.65"/>
        <rect x="144" y="144" width="22" height="22" rx="3" fill="#818cf8" fill-opacity="0.26"/>
      </g>
      <text x="0" y="206" font-size="12.5" fill="#99a5bf" font-family="sans-serif">每个格子的明暗 = 一个参数（数字）的大小</text>
    </g>
  </g>

  <!-- 中：单个参数放大 -->
  <g transform="translate(280,88)">
    <rect x="0" y="0" width="110" height="110" rx="10" fill="#22d3ee18" stroke="#22d3ee" stroke-width="1.6"/>
    <text x="55" y="58" text-anchor="middle" font-size="20" font-weight="700" fill="#22d3ee" font-family="monospace">0.0271</text>
    <text x="55" y="86" text-anchor="middle" font-size="12.5" fill="#b6c0d6" font-family="sans-serif">一个参数 = 一个数字</text>
    <text x="55" y="132" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="monospace">FP16 = 2 字节</text>
  </g>
  <!-- 组间连接：左矩阵 -> 单参数 -> 右算式 -->
  <g stroke="#5f7194" stroke-width="1.8" fill="none">
    <path d="M226 143 L274 143"/>
    <path d="M394 143 L474 143"/>
    <path d="M270 138 L276 143 L270 148" />
    <path d="M468 138 L474 143 L468 148" />
  </g>

  <!-- 右：算式与对比 -->
  <g transform="translate(480,50)">
    <rect x="0" y="0" width="440" height="94" rx="12" fill="#fbbf2410" stroke="#fbbf2477" stroke-width="1.2"/>
    <text x="24" y="38" font-size="15" font-weight="700" fill="#fbbf24" font-family="monospace">7,000,000,000 个参数 × 2 字节</text>
    <text x="24" y="68" font-size="17" font-weight="700" fill="#e8ecf6" font-family="monospace">≈ 14GB —— 仅权重</text>
    <text x="0" y="130" font-size="13.5" fill="#b6c0d6" font-family="sans-serif">放手机里是什么概念：</text>
    <g font-family="sans-serif">
      <rect x="0" y="148" width="200" height="66" rx="10" fill="#818cf812" stroke="#818cf866" stroke-width="1"/>
      <rect x="16" y="158" width="168" height="24" rx="5" fill="#818cf833" stroke="#818cf8" stroke-width="1"/>
      <text x="100" y="174.5" text-anchor="middle" font-size="12" fill="#818cf8" font-family="monospace">整机内存 8GB</text>
      <text x="100" y="206" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="sans-serif">连塞都塞不下（系统还要占一半）</text>
      <rect x="240" y="148" width="200" height="66" rx="10" fill="#e879f912" stroke="#e879f966" stroke-width="1"/>
      <rect x="256" y="158" width="168" height="24" rx="5" fill="#e879f933" stroke="#e879f9" stroke-width="1"/>
      <text x="340" y="174.5" text-anchor="middle" font-size="12" fill="#e879f9" font-family="monospace">32K 对话的 KV 缓存还要另算数 GB</text>
      <text x="340" y="206" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="sans-serif">所以第一关是「装得下」，不是「算得快」</text>
    </g>
  </g>
</svg>
