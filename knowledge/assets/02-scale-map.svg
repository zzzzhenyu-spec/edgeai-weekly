<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="对称与非对称量化映射">
  <defs>
    <linearGradient id="sm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1424"/><stop offset="1" stop-color="#101a30"/>
    </linearGradient>
  </defs>
  <rect width="960" height="400" fill="url(#sm-bg)" rx="14"/>
  <text x="480" y="44" text-anchor="middle" font-size="15.5" font-weight="700" fill="#e8ecf6" font-family="sans-serif">零点放哪：对称量化 vs 非对称量化（金色点动态演示落入格子）</text>

  <!-- 上：对称（权重） -->
  <text x="70" y="88" font-size="14" font-weight="700" fill="#22d3ee" font-family="sans-serif">对称量化 · 权重的常态（零点 = 0）</text>
  <line x1="80" y1="130" x2="560" y2="130" stroke="#ffffff30" stroke-width="1.6"/>
  <g stroke="#ffffff20" stroke-width="1">
    <line x1="150" y1="124" x2="150" y2="136"/><line x1="220" y1="124" x2="220" y2="136"/>
    <line x1="360" y1="124" x2="360" y2="136"/><line x1="430" y1="124" x2="430" y2="136"/>
    <line x1="500" y1="124" x2="500" y2="136"/>
  </g>
  <text x="115" y="156" font-size="12.5" fill="#99a5bf" font-family="monospace">−3.2</text>
  <text x="316" y="156" font-size="12.5" fill="#99a5bf" font-family="monospace">0</text>
  <text x="524" y="156" font-size="12.5" fill="#99a5bf" font-family="monospace">+3.2</text>
  <circle cx="255" cy="130" r="5" fill="#fbbf24">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <path d="M255 138 C 255 175, 300 172, 322 196" stroke="#fbbf2488" stroke-width="1.4" fill="none" stroke-dasharray="4 4">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.6s" repeatCount="indefinite"/>
  </path>

  <g>
    <rect x="620" y="104" width="290" height="104" rx="8" fill="#22d3ee0e" stroke="#22d3ee" stroke-width="1.2"/>
    <g stroke="#22d3ee55" stroke-width="1">
      <line x1="640.6" y1="104" x2="640.6" y2="208"/><line x1="661.2" y1="104" x2="661.2" y2="208"/>
      <line x1="681.8" y1="104" x2="681.8" y2="208"/><line x1="702.4" y1="104" x2="702.4" y2="208"/>
      <line x1="723" y1="104" x2="723" y2="208"/><line x1="743.6" y1="104" x2="743.6" y2="208"/>
      <line x1="764.2" y1="104" x2="764.2" y2="208"/><line x1="784.8" y1="104" x2="784.8" y2="208"/>
      <line x1="805.4" y1="104" x2="805.4" y2="208"/><line x1="826" y1="104" x2="826" y2="208"/>
      <line x1="846.6" y1="104" x2="846.6" y2="208"/><line x1="867.2" y1="104" x2="867.2" y2="208"/>
      <line x1="887.8" y1="104" x2="887.8" y2="208"/>
    </g>
    <text x="765" y="96" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="monospace">INT4 格子 −8 … +7</text>
    <circle cx="345" cy="156" r="5" fill="#fbbf24">
      <animate attributeName="cy" values="180;156;156;180" dur="1.6s" repeatCount="indefinite" calcMode="discrete"/>
    </circle>
    <text x="765" y="232" text-anchor="middle" font-size="12.5" fill="#b6c0d6" font-family="monospace">q = round(x / scale)　零点天然对齐</text>
  </g>

  <!-- 下：非对称（激活） -->
  <text x="70" y="272" font-size="14" font-weight="700" fill="#818cf8" font-family="sans-serif">非对称量化 · 激活的常态（ReLU 后全在正半轴）</text>
  <line x1="80" y1="314" x2="560" y2="314" stroke="#ffffff30" stroke-width="1.6"/>
  <g stroke="#ffffff20" stroke-width="1">
    <line x1="150" y1="308" x2="150" y2="320"/><line x1="220" y1="308" x2="220" y2="320"/>
    <line x1="290" y1="308" x2="290" y2="320"/><line x1="430" y1="308" x2="430" y2="320"/>
    <line x1="500" y1="308" x2="500" y2="320"/>
  </g>
  <text x="80" y="340" font-size="12.5" fill="#99a5bf" font-family="monospace">0</text>
  <text x="524" y="340" font-size="12.5" fill="#99a5bf" font-family="monospace">+4.2</text>
  <circle cx="470" cy="314" r="5" fill="#fbbf24">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

  <g>
    <rect x="620" y="288" width="290" height="82" rx="8" fill="#818cf80e" stroke="#818cf8" stroke-width="1.2"/>
    <g stroke="#818cf855" stroke-width="1">
      <line x1="639.3" y1="288" x2="639.3" y2="370"/><line x1="658.6" y1="288" x2="658.6" y2="370"/>
      <line x1="677.9" y1="288" x2="677.9" y2="370"/><line x1="697.2" y1="288" x2="697.2" y2="370"/>
      <line x1="716.5" y1="288" x2="716.5" y2="370"/><line x1="735.8" y1="288" x2="735.8" y2="370"/>
      <line x1="755.1" y1="288" x2="755.1" y2="370"/><line x1="774.4" y1="288" x2="774.4" y2="370"/>
      <line x1="793.7" y1="288" x2="793.7" y2="370"/><line x1="813" y1="288" x2="813" y2="370"/>
      <line x1="832.3" y1="288" x2="832.3" y2="370"/><line x1="851.6" y1="288" x2="851.6" y2="370"/>
      <line x1="870.9" y1="288" x2="870.9" y2="370"/><line x1="890.2" y1="288" x2="890.2" y2="370"/>
    </g>
    <text x="765" y="280" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="monospace">INT4 格子 0 … 15</text>
    <text x="765" y="388" text-anchor="middle" font-size="12.5" fill="#b6c0d6" font-family="monospace">q = round(x / scale) + zero　零点右移占满格子</text>
  </g>
  <text x="310" y="376" text-anchor="middle" font-size="12.5" fill="#99a5bf" font-family="sans-serif">负半轴整段空着 → 对称模式浪费一半格子，非对称用 zero 点补回来</text>
</svg>
